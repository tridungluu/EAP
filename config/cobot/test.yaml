# T=1 Teacher evaluation configuration
work_dir: ./work_dir/teacher/hypersa_fcce_dstcl_T1_v1

# Evaluation data: full skeleton sequence (100%)
feeder: feeder.feeder_clr.Feeder
test_feeder_args:
  data_path: ./datacobot_v2_full_gcn/xsub/val_position.npy
  label_path: ./datacobot_v2_full_gcn/xsub/val_label.pkl
  text_path: text_prompts.json
  data_ratio: 1.0
  bone: False
  obs_ratio: 1.0

# Teacher architecture: MUST match the T=1 teacher training YAML
model: net.teacher.TeacherModel
model_args:
  base_encoder: net.hypersa_ae.HyperSAEncoder
  num_class: 16
  num_point: 48
  num_person: 1
  drop_out: 0.5
  graph: graph.cobot.Graph
  graph_args:
    labeling_mode: 'distance'
  channels: [64, 128, 256]
  strides: [1, 2, 2]
  heads: 8
  num_hyperedges: 5
  root_joint: 0
  sta_stride: 2
  tau: 0.125
  rho: 0.9
  ctx_ch: 384
  context_t_len: 1
  disentangle_t_len: 24

# Evaluation
phase: test
weights: ./work_dir/teacher/hypersa_fcce_dstcl_T1_v1/best_model.pt
device: [0]
test_batch_size: 32
