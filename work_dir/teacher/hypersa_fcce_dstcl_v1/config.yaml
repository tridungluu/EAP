# command line: main.py train_teacher -c config/cobot/trainhypherclr.yaml

alpha: null
base_lr: 0.025
batch_size: 32
config: config/cobot/trainhypherclr.yaml
debug: false
device:
- 0
eval_interval: 5
feature_distillation:
    align: 0
    cosine: 0
    spatial: 1
feeder: feeder.feeder_clr.Feeder
ignore_weights: []
kd_T: 1
log_interval: 100
logits_distillation:
    ctkd: 0
    dkd: 0
    hardkd: 0
    kd: 0.5
lr_decay_rate: 0.1
model: net.teacher.TeacherModel
model_args:
    base_encoder: net.hypersa_ae.HyperSAEncoder
    channels:
    - 64
    - 128
    - 256
    ctx_ch: 384
    drop_out: 0.5
    graph: graph.cobot.Graph
    graph_args:
        labeling_mode: distance
    heads: 8
    num_class: 16
    num_hyperedges: 5
    num_person: 1
    num_point: 48
    rho: 0.9
    root_joint: 0
    sta_stride: 2
    strides:
    - 1
    - 2
    - 2
    t_len: 24
    tau: 0.125
nesterov: true
num_epoch: 300
num_worker: 4
optimizer: SGD
pavi_log: false
phase: train
print_log: true
save_interval: 10
save_log: true
save_result: false
show_topk:
- 1
- 5
start_epoch: 0
step:
- 150
- 225
teacher_model: null
teacher_model_args: {}
teacher_weights: null
test_batch_size: 32
test_feeder_args:
    bone: false
    data_path: ./datacobot_v2_full_gcn/xsub/val_position.npy
    label_path: ./datacobot_v2_full_gcn/xsub/val_label.pkl
    text_path: text_prompts.json
text_args: {}
text_encoder: null
train_feeder_args:
    bone: false
    data_path: ./datacobot_v2_full_gcn/xsub/train_position.npy
    data_ratio: 1.0
    label_path: ./datacobot_v2_full_gcn/xsub/train_label.pkl
    text_path: text_prompts.json
use_gpu: true
w_ce: 1.0
w_cl: 0.1
w_sta: 1.0
warm_up_epoch: 0
weight_decay: 0.0001
weights: null
work_dir: ./work_dir/teacher/hypersa_fcce_dstcl_v1
